# Coolify-oriented compose for a self-hosted Plane fork.
#
# Differences from the default docker-compose.yml:
#   - Every service reads the single root `.env` (Coolify writes it from the
#     environment variables you set in the UI). The default compose reads
#     ./apps/api/.env, which Coolify does not create.
#   - Volumes have explicit, stable names so Coolify redeploys reuse the same
#     Postgres/Redis/MinIO/RabbitMQ data instead of creating new volumes when
#     the Compose project name changes.
#   - Postgres uses the pgvector image (required by the AI/RAG migrations).
#   - The bundled Caddy proxy binds to configurable ports so it does not clash
#     with Coolify's own reverse proxy; point your Coolify domain at it.
#
# Usage (in Coolify: a "Docker Compose" resource pointing at this repo):
#   docker compose -f docker-compose.coolify.yml up -d --build
#
# Required environment variables (set in Coolify):
#   SECRET_KEY, POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB,
#   RABBITMQ_USER, RABBITMQ_PASSWORD, RABBITMQ_VHOST,
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_S3_BUCKET_NAME,
#   APP_BASE_URL, ADMIN_BASE_URL, SPACE_BASE_URL, LIVE_BASE_URL,
#   CORS_ALLOWED_ORIGINS, LISTEN_HTTP_PORT (optional, default 8080),
#   LLM_* (optional), AI_RATE_LIMIT (optional)

services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
    restart: always
    depends_on:
      - api

  admin:
    container_name: admin
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
    restart: always
    depends_on:
      - api
      - web

  space:
    container_name: space
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
    restart: always
    depends_on:
      - api
      - web

  api:
    container_name: api
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - .env
    depends_on:
      - plane-db
      - plane-redis

  worker:
    container_name: bgworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
    restart: always
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - .env
    depends_on:
      - api
      - plane-db
      - plane-redis

  beat-worker:
    container_name: beatworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
    restart: always
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - .env
    depends_on:
      - api
      - plane-db
      - plane-redis

  migrator:
    container_name: plane-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    env_file:
      - .env
    depends_on:
      - plane-db
      - plane-redis

  live:
    container_name: plane-live
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
    restart: always

  plane-db:
    container_name: plane-db
    image: pgvector/pgvector:pg15
    restart: always
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data

  plane-redis:
    container_name: plane-redis
    image: valkey/valkey:7.2.11-alpine
    restart: always
    volumes:
      - redisdata:/data

  plane-mq:
    container_name: plane-mq
    image: rabbitmq:3.13.6-management-alpine
    restart: always
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  plane-minio:
    container_name: plane-minio
    image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: always
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}

  # Bundled reverse proxy. Coolify routes your domain to the mapped HTTP port.
  proxy:
    container_name: proxy
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.ce
    restart: always
    ports:
      - ${LISTEN_HTTP_PORT:-8080}:80
      - ${LISTEN_HTTPS_PORT:-8443}:443
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
    depends_on:
      - web
      - api
      - space
      - admin

volumes:
  pgdata:
    name: plane_pgdata
  redisdata:
    name: plane_redisdata
  uploads:
    name: plane_uploads
  rabbitmq_data:
    name: plane_rabbitmq_data
